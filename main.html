<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aternos 24/7 Bot</title>
    <style>
      :root {
        --bg: #000000;
        --panel: #070707;
        --panel-2: #0d0d0d;
        --line: #1c1c1c;
        --line-soft: #141414;
        --fg: #f4f4f4;
        --fg-dim: #8a8a8a;
        --fg-faint: #4a4a4a;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 32px 20px 56px;
      }

      /* Faint grid so the pure black has some depth. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.022) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.022) 1px, transparent 1px);
        background-size: 44px 44px;
        pointer-events: none;
        z-index: 0;
      }

      .shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 660px;
      }

      /* ---------- header ---------- */

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }

      .mark {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--panel-2);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .titles h1 {
        margin: 0;
        font-size: 1.02rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .titles p {
        margin: 3px 0 0;
        font-size: 0.76rem;
        color: var(--fg-dim);
        font-family: var(--mono);
      }

      /* ---------- status ---------- */

      .status {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        padding: 20px;
        margin-bottom: 14px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--fg-faint);
        flex-shrink: 0;
        position: relative;
      }

      .dot::after {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1px solid currentColor;
        opacity: 0;
      }

      /* Monochrome states: brightness carries the meaning, not hue. */
      [data-phase="online"] .dot { background: #ffffff; color: #ffffff; }
      [data-phase="online"] .dot::after { animation: ring 2.4s ease-out infinite; }
      [data-phase="connecting"] .dot,
      [data-phase="authenticating"] .dot { background: #9a9a9a; animation: blink 1.1s ease-in-out infinite; }
      [data-phase="offline"] .dot { background: #333333; }

      @keyframes ring {
        0%   { opacity: 0.7; transform: scale(0.7); }
        100% { opacity: 0;   transform: scale(1.7); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.28; }
      }

      .phase-label {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }

      .uptime {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 0.76rem;
        color: var(--fg-dim);
        font-variant-numeric: tabular-nums;
      }

      .status-msg {
        margin: 14px 0 0;
        font-size: 0.9rem;
        color: var(--fg);
        line-height: 1.45;
        min-height: 1.3em;
      }

      /* ---------- stats ---------- */

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .stat {
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        background: var(--panel);
        padding: 13px 12px;
        min-width: 0;
      }

      .stat-head {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--fg-faint);
        margin-bottom: 9px;
      }

      .stat-head span {
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stat-value {
        font-family: var(--mono);
        font-size: 0.92rem;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stat-value.dim { color: var(--fg-faint); }

      /* ---------- controls ---------- */

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      button {
        appearance: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel-2);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
      }

      button:hover:not(:disabled) {
        background: #171717;
        border-color: #2e2e2e;
      }

      button:active:not(:disabled) { transform: translateY(1px); }

      button:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.32;
        cursor: not-allowed;
      }

      button.primary {
        background: #f4f4f4;
        color: #000000;
        border-color: #f4f4f4;
      }

      button.primary:hover:not(:disabled) {
        background: #ffffff;
        border-color: #ffffff;
      }

      /* ---------- log ---------- */

      .log {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        overflow: hidden;
      }

      .log-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line-soft);
        color: var(--fg-faint);
      }

      .log-head span {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .log-body {
        max-height: 232px;
        overflow-y: auto;
        padding: 10px 6px 10px 16px;
        font-family: var(--mono);
        font-size: 0.74rem;
        line-height: 1.7;
      }

      .log-body::-webkit-scrollbar { width: 8px; }
      .log-body::-webkit-scrollbar-thumb {
        background: #1f1f1f;
        border-radius: 4px;
      }

      .log-line {
        display: flex;
        gap: 10px;
        color: var(--fg-dim);
        word-break: break-word;
      }

      .log-line time {
        color: var(--fg-faint);
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
      }

      .log-empty {
        color: var(--fg-faint);
        font-style: italic;
      }

      footer {
        margin-top: 18px;
        text-align: center;
        font-family: var(--mono);
        font-size: 0.66rem;
        color: #2f2f2f;
        letter-spacing: 0.08em;
      }

      @media (max-width: 560px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
        .controls { grid-template-columns: 1fr; }
        .uptime { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell" data-phase="offline">
      <header>
        <div class="mark">
          <!-- cube mark -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f4f4f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6 21 7.3v9.4L12 21.4 3 16.7V7.3z" />
            <path d="M3 7.3 12 12l9-4.7M12 12v9.4" />
          </svg>
        </div>
        <div class="titles">
          <h1>Aternos 24/7 Bot</h1>
          <p id="target">&mdash;</p>
        </div>
      </header>

      <section class="status">
        <div class="status-row">
          <i class="dot"></i>
          <span class="phase-label" id="phase">offline</span>
          <span class="uptime" id="uptime">00:00:00</span>
        </div>
        <p class="status-msg" id="statusMsg">Connecting to control server&hellip;</p>
      </section>

      <section class="stats">
        <div class="stat">
          <div class="stat-head">
            <!-- user -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.6" />
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
            </svg>
            <span>Bot</span>
          </div>
          <div class="stat-value dim" id="statUser">&mdash;</div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <!-- pulse -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h4l2.5-6 4 12 2.5-6H22" />
            </svg>
            <span>Health</span>
          </div>
          <div class="stat-value dim" id="statHealth">&mdash;</div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <!-- pin -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s6.5-5.7 6.5-10.5A6.5 6.5 0 0 0 5.5 10.5C5.5 15.3 12 21 12 21z" />
              <circle cx="12" cy="10.3" r="2.3" />
            </svg>
            <span>Position</span>
          </div>
          <div class="stat-value dim" id="statPos">&mdash;</div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <!-- orbit -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 3.2a8.8 8.8 0 1 1-6.2 2.6" />
            </svg>
            <span>Anti-AFK</span>
          </div>
          <div class="stat-value dim" id="statAfk">&mdash;</div>
        </div>
      </section>

      <section class="controls">
        <button id="btnStart" class="primary" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8a1 1 0 0 0 0-1.8L9.6 4.3A1 1 0 0 0 8 5.2z" />
          </svg>
          Start
        </button>

        <button id="btnStop" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2.2" />
          </svg>
          Stop
        </button>

        <button id="btnReconnect" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.7-6.2" />
            <path d="M20.6 4.4v5h-5" />
          </svg>
          Reconnect
        </button>
      </section>

      <section class="log">
        <div class="log-head">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 6.5 9 10l-4 3.5" />
            <path d="M11.5 15h7.5" />
          </svg>
          <span>Activity</span>
        </div>
        <div class="log-body" id="logBody">
          <div class="log-line log-empty">Waiting for events&hellip;</div>
        </div>
      </section>

      <footer>ANTI-IDLE KEEPALIVE &middot; MINECRAFT 26.2</footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const shell = document.getElementById('shell');
      const phaseEl = document.getElementById('phase');
      const statusMsg = document.getElementById('statusMsg');
      const uptimeEl = document.getElementById('uptime');
      const targetEl = document.getElementById('target');
      const logBody = document.getElementById('logBody');

      const statUser = document.getElementById('statUser');
      const statHealth = document.getElementById('statHealth');
      const statPos = document.getElementById('statPos');
      const statAfk = document.getElementById('statAfk');

      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const btnReconnect = document.getElementById('btnReconnect');

      let logEmpty = true;

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function formatUptime(ms) {
        const total = Math.floor(ms / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        return pad(h) + ':' + pad(m) + ':' + pad(s);
      }

      function setValue(el, value) {
        if (value === null || value === undefined || value === '') {
          el.textContent = '—';
          el.classList.add('dim');
        } else {
          el.textContent = value;
          el.classList.remove('dim');
        }
      }

      socket.on('bot_state', (state) => {
        shell.dataset.phase = state.phase;
        phaseEl.textContent = state.phase;
        uptimeEl.textContent = formatUptime(state.uptimeMs || 0);
        targetEl.textContent = state.host + ':' + state.port;

        setValue(statUser, state.username);
        setValue(statHealth, state.health === null ? null : state.health + ' / 20');
        setValue(
          statPos,
          state.position ? state.position.x + ' ' + state.position.y + ' ' + state.position.z : null
        );
        setValue(statAfk, state.antiAfkSeconds ? 'every ' + state.antiAfkSeconds + 's' : null);

        const online = state.phase === 'online';
        const offline = state.phase === 'offline';
        btnStart.disabled = !offline;
        btnStop.disabled = offline;
        btnReconnect.disabled = offline;
      });

      socket.on('bot_status', (msg) => {
        statusMsg.textContent = msg;
      });

      function appendLog(entry) {
        if (logEmpty) {
          logBody.innerHTML = '';
          logEmpty = false;
        }
        const time = new Date(entry.at);
        const row = document.createElement('div');
        row.className = 'log-line';

        const stamp = document.createElement('time');
        stamp.textContent =
          pad(time.getHours()) + ':' + pad(time.getMinutes()) + ':' + pad(time.getSeconds());

        const text = document.createElement('div');
        text.textContent = entry.line;

        row.append(stamp, text);
        logBody.append(row);

        while (logBody.children.length > 120) logBody.removeChild(logBody.firstChild);
        logBody.scrollTop = logBody.scrollHeight;
      }

      socket.on('bot_log_history', (entries) => {
        if (!entries || !entries.length) return;
        logBody.innerHTML = '';
        logEmpty = false;
        entries.forEach(appendLog);
      });

      socket.on('bot_log', appendLog);

      socket.on('disconnect', () => {
        shell.dataset.phase = 'offline';
        phaseEl.textContent = 'offline';
        statusMsg.textContent = 'Lost connection to the control server.';
      });

      btnStart.addEventListener('click', () => socket.emit('control_bot', 'start'));
      btnStop.addEventListener('click', () => socket.emit('control_bot', 'stop'));
      btnReconnect.addEventListener('click', () => socket.emit('control_bot', 'reconnect'));
    </script>
  </body>
</html>
